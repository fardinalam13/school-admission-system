name: school-admission

services:
  postgres:
    image: postgres:16-alpine
    # Headroom for bursts of simultaneous applications and for several backend instances
    # (each backend instance uses at most 50 pooled connections by default).
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_DB: admission
      POSTGRES_USER: admission
      POSTGRES_PASSWORD: admission
    volumes:
      # Named volume: data survives `docker compose down` / `docker compose up` (rule 6).
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admission -d admission"]
      interval: 3s
      timeout: 3s
      retries: 20
    # Not published to the host by default; uncomment to inspect with a local client.
    # ports:
    #   - "5432:5432"

  backend:
    build: ./backend
    image: school-admission-backend
    environment:
      # Database connection is configurable through this variable (brief §1.2).
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=admission;Username=admission;Password=admission
      # Hold lifetime in seconds; default 600 (rule 2). Override with HOLD_DURATION_SECONDS=120 docker compose up
      HOLD_DURATION_SECONDS: ${HOLD_DURATION_SECONDS:-600}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Bonus: a second backend process on another port, sharing the same database. Not started by a
  # plain `docker compose up`; enable it with:  docker compose --profile two-instances up -d
  backend-2:
    image: school-admission-backend
    profiles: ["two-instances"]
    environment:
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=admission;Username=admission;Password=admission
      HOLD_DURATION_SECONDS: ${HOLD_DURATION_SECONDS:-600}
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      # The browser calls the backend directly, so this must be the address reachable from the
      # evaluator's machine, not the compose-internal hostname. Written into /config.js at start.
      API_BASE_URL: ${API_BASE_URL:-http://localhost:8080}
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres-data:
